name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Las imágenes ubuntu-latest ya traen el SDK de Android y las licencias
      # aceptadas; setup-android@v3 falla en esas imágenes por el paquete
      # legacy 'tools', así que solo se instala lo que falte.
      - name: SDK de Android
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true
          fi

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Unit + migraciones (corren en JVM, sin emulador).
      - name: Tests unitarios
        run: ./gradlew :shared:testDebugUnitTest --no-daemon

      # Que el APK de release compile (R8 incluido) en cada push.
      - name: Compilar release sin firmar
        run: ./gradlew :app:assembleRelease --no-daemon
