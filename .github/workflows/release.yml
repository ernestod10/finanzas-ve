name: Release

# Un tag vX.Y.Z publica el APK en GitHub Releases. De ahí lo bajan quienes ya
# tienen la app instalada: en Menú → Aplicación, la app compara su versión con
# la de la última release y se descarga la nueva.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build y publicar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Las imágenes ubuntu-latest ya traen el SDK de Android y las licencias
      # aceptadas; setup-android@v3 falla en esas imágenes por el paquete
      # legacy 'tools', así que solo se instala lo que falte.
      - name: SDK de Android
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null || true
          fi

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # El keystore es el mismo que firma en local: si cambia, Android rechaza
      # la actualización por firma distinta.
      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TUBOLSILLO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto TUBOLSILLO_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tubolsillo.jks"

      - name: Tests unitarios
        run: ./gradlew :shared:testDebugUnitTest --no-daemon

      - name: Build release
        env:
          TUBOLSILLO_KEYSTORE: ${{ runner.temp }}/tubolsillo.jks
          TUBOLSILLO_KEYSTORE_PASSWORD: ${{ secrets.TUBOLSILLO_KEYSTORE_PASSWORD }}
          TUBOLSILLO_KEY_ALIAS: ${{ secrets.TUBOLSILLO_KEY_ALIAS }}
          TUBOLSILLO_KEY_PASSWORD: ${{ secrets.TUBOLSILLO_KEY_PASSWORD }}
        # El versionCode lo deriva Gradle del nombre (0.1.1 → 101), así el APK
        # de CI y el local de la misma versión son intercambiables.
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName="${GITHUB_REF_NAME}"

      - name: Renombrar APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "TuBolsillo-${VERSION}.apk"
          sha256sum "TuBolsillo-${VERSION}.apk" > "TuBolsillo-${VERSION}.apk.sha256"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TuBolsillo-*.apk
            TuBolsillo-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
