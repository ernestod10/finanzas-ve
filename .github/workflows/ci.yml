name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Unit + migraciones (corren en JVM, sin emulador).
      - name: Tests unitarios
        run: ./gradlew :shared:testDebugUnitTest --no-daemon

      # Que el APK de release compile (R8 incluido) en cada push.
      - name: Compilar release sin firmar
        run: ./gradlew :app:assembleRelease --no-daemon
