org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9: KSP (Room y App Functions) todavía no soporta el Kotlin integrado de
# AGP, así que se sigue usando el plugin org.jetbrains.kotlin.android. Ese
# plugin además no es compatible con el DSL nuevo de AGP 9 (newDsl), de ahí los
# dos opt-outs. Ambos desaparecen en AGP 10: migrar cuando KSP lo soporte.
android.builtInKotlin=false
android.newDsl=false
android.enableR8.fullMode=false
